name: Rebuild index and prep pages

on:
  push:
    branches: [main]
    paths: ["questions/**", "questions.json", "tools/build_index.py"]
  schedule:
    - cron: "17 6 * * *"   # daily, picks up newly merged Data Explained case files
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: suryanaraynan/data-explained
          path: _case
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_index.py --case-repo _case
      - name: Commit if changed
        run: |
          git add README.md prep/
          if ! git diff --cached --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update index and prep pages"
            git push
          fi
